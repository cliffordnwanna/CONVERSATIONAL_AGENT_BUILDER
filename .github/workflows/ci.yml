name: Validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run eval
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - name: End-to-end API check (offline mode, no key)
        run: |
          OPENAI_API_KEY= npm start -- -p 3300 &
          for i in $(seq 1 30); do curl -sf localhost:3300/api/health && break; sleep 1; done
          BASE_URL=http://localhost:3300 npm run e2e
        env:
          OPENAI_API_KEY: ''
